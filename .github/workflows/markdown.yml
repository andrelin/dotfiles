name: Markdown

on:
  push:
    paths:
      - '**.md'
      - 'bin/check-md-limits'
      - '.md-baseline'
      - '**/.markdownlint.json'
      - '.markdownlint.json'
      - '.github/workflows/markdown.yml'

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown lint + ToCs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0

      - name: Install doctoc and markdownlint-cli2
        run: npm install -g doctoc markdownlint-cli2

      - name: markdownlint-cli2
        run: markdownlint-cli2 '**/*.md' '#node_modules' '#website/node_modules' '#website/docs-generated' '#vendor'

      # Errors only: the nearing-the-cap advisory belongs in the pre-commit hook, where
      # the author can act on it. A CI step that cannot fail is exactly what this repo bans.
      - name: Line and file length limits
        run: bin/check-md-limits --no-warn

      # Catches a hand-edited baseline the tool would not have written — a raised
      # number, a stale one, a malformed line — and, separately, a pin deleted
      # outright, which regeneration cannot restore. What remains uncaught is a
      # pin raised in the same commit that grows the file into it; that shows up
      # in the .md-baseline diff, which is why this file is small and committed.
      - name: .md-baseline matches what the tool would write
        run: |
          # A pin can only be removed by the file shrinking under its warn line,
          # which regeneration would have done for us.
          git show HEAD:.md-baseline 2>/dev/null | awk -F'\t' '!/^#/ && NF == 2 { print $2 }' > /tmp/pins-before || true
          bin/check-md-limits --update-baseline >/dev/null
          while read -r pin; do
            grep -qF "	$pin" .md-baseline && continue
            echo "::error::pin for $pin disappeared from .md-baseline without the file shrinking."
            exit 1
          done < /tmp/pins-before
          git diff --exit-code -- .md-baseline || {
            echo "::error::.md-baseline does not match what the tool would write."
            echo "Run 'bin/check-md-limits --update-baseline' locally and commit the result."
            exit 1
          }

      # claude/ and .claude/ are exempt: a ToC is a navigation aid for humans browsing on
      # GitHub, and nothing under either is read that way — both are agent-loaded context.
      - name: Enforce doctoc opt-in/opt-out on every markdown file outside claude/
        run: |
          mapfile -t md_files < <(find . -type f -name '*.md' -not -path './node_modules/*' -not -path './vendor/*' -not -path './claude/*' -not -path './.claude/*')
          missing=()
          for f in "${md_files[@]}"; do
            grep -qE '<!-- (START doctoc|DOCTOC SKIP)' "$f" || missing+=("$f")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::These markdown files lack both doctoc markers and '<!-- DOCTOC SKIP -->':"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

      - name: doctoc — verify ToCs are up to date
        run: |
          mapfile -t md_files < <(find . -type f -name '*.md' -not -path './node_modules/*' -not -path './vendor/*' -not -path './claude/*' -not -path './.claude/*')
          doctoc --github --notitle "${md_files[@]}"
          if ! git diff --quiet -- '*.md'; then
            echo "::error::doctoc found stale ToCs. Re-run doctoc locally on all markdown files and commit."
            git --no-pager diff -- '*.md'
            exit 1
          fi
