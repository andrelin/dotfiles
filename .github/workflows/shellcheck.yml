name: ShellCheck
on:
  push:
    paths-ignore:
      # Docs and site content: none of it affects whether dotfiles installs or lints.
      - 'website/**'
      - 'tips/**'
      - 'docs/**'
      - '.claude/**'
      - '**.md'
      - '.md-baseline'
      - 'LICENSE'
      # Renovate config: renovate-presets.yml validates it.
      - 'renovate/**'
      - '.github/renovate.json'

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        run: |
          shellcheck --version
          failed=0
          for f in bin/dotfiles bin/eachdir bin/isip bin/check-md-limits \
                   bin/sync-claude-deny bin/sort-claude-settings bin/claude-settings-merge \
                   bin/skill-trigger-eval \
                   hooks/pre-commit \
                   claude/statusline-command.sh claude/hooks/work-context.sh claude/shims/shim.sh \
                   init/*.sh source/*.sh test/*.sh \
                   link/.bashrc link/.bash_profile; do
            echo "--- $f ---"
            shellcheck -x -s bash --severity=warning "$f" || failed=1
          done
          exit $failed
