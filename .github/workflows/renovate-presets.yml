name: Renovate presets

on:
  push:
    paths:
      - 'renovate/**'
      - 'test/renovate_presets.mjs'
      - '**.md'
      - '.github/renovate.json'
      - '.github/workflows/renovate-presets.yml'

permissions:
  contents: read

env:
  RENOVATE_VERSION: 44.145.1 # renovate: npm=renovate

jobs:
  # Every repo that extends these presets breaks silently on an invalid one,
  # so a bad preset has to fail here rather than in Renovate's logs.
  validate:
    name: Validate Renovate presets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0

      - name: Install Renovate
        run: npm install --prefix "$RUNNER_TEMP/renovate" --no-save --ignore-scripts "renovate@$RENOVATE_VERSION"

      # --no-global: these are repo config, so options only global config may set have to fail.
      - name: renovate-config-validator
        run: '"$RUNNER_TEMP/renovate/node_modules/.bin/renovate-config-validator" --strict --no-global renovate/*.json .github/renovate.json'

      - name: Preset references, enum values and resolved behaviour
        run: RENOVATE_DIR="$RUNNER_TEMP/renovate" node test/renovate_presets.mjs
